# Weekly update PRs for the Python lockfile and the GitHub Actions used in workflows.
# Updates are grouped so a busy week is one PR per ecosystem, not one per package.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
