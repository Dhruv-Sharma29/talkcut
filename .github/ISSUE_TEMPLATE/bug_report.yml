name: Bug report
description: Something broke or gave a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The command you ran, and the steps in the editor if it was there.
      placeholder: |
        uv run talkcut episode.mp3 --remove-fillers -o clean.mp3
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Paste the terminal output or browser console error, if any.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS and version, Python version, `ffmpeg -version` first line, talkcut commit.
      placeholder: macOS 26.1, Python 3.12.8, ffmpeg 7.1, commit b2abac1
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please don't attach recordings of other people. Describe the audio instead (length, speakers, format).
