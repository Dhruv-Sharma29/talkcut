name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg 7+ (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ -C "$HOME/.local/bin" --strip-components=1
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            brew install ffmpeg
          fi

      - name: Verify FFmpeg
        run: |
          ffmpeg -version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run tests
        run: uv run --python 3.12 pytest
