[project]
name = "talkcut"
version = "0.1.0"
description = "Edit spoken audio by editing its transcript. Local Whisper, nothing leaves your machine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = ["faster-whisper>=1.1"]

[project.scripts]
talkcut = "talkcut.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
